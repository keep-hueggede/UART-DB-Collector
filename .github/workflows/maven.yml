# Builds all Maven modules (core, collector, webserver) and runs their unit tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write   # dependency graph submission

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and run unit tests
      run: mvn -B verify --file pom.xml

    - name: Test summary
      if: always()
      run: |
        {
          echo "### Unit tests"
          echo "| Module | Tests | Failures | Errors | Skipped |"
          echo "|---|---|---|---|---|"
          for m in core collector webserver; do
            t=0; f=0; e=0; s=0
            for x in $m/target/surefire-reports/TEST-*.xml; do
              [ -f "$x" ] || continue
              head=$(grep -o '<testsuite [^>]*>' "$x" | head -1)
              get() { echo "$head" | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*'; }
              t=$((t + $(get tests))); f=$((f + $(get failures))); e=$((e + $(get errors))); s=$((s + $(get skipped)))
            done
            echo "| $m | $t | $f | $e | $s |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '*/target/surefire-reports/'
        if-no-files-found: ignore

    - name: Upload jars
      uses: actions/upload-artifact@v4
      with:
        name: jars
        path: |
          collector/target/uart-db-collector.jar
          webserver/target/uart-db-webserver.jar

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      if: github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
